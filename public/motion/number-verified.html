<script>

  const config={"id": "number-verified", "title": "Teléfono verificado", "kind": "illustration", "width": 392.0, "height": 393, "duration": 10.8, "movement": 2.8, "pause": 8, "figma": "28:4482"};
  const svg=document.querySelector('svg');

  let time=0, playing=false, loop=config.kind==='illustration', last=0, frame=0, reported=0;
  let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  const complete=()=>{
    if(finished)return;
    finished=true;
    if(window.ServelAndroid)window.ServelAndroid.completed();
    if(window.ServelFlutter)window.ServelFlutter.postMessage('completed');
    window.dispatchEvent(new Event('servel-motion-completed'));
  };
  function pause(){playing=false;cancelAnimationFrame(frame);emit();}
  function tick(now){
    if(!playing)return;
    time+=Math.max(0,(now-last)/1000);last=now;
    if(config.kind==='splash'&&time>=config.movement)complete();
    if(time>=config.duration){
      complete();
      if(loop){time%=config.duration;finished=false;}
      else{time=config.duration;playing=false;}
    }
    render();
    if(now-reported>80||!playing){emit();reported=now;}
    if(playing)frame=requestAnimationFrame(tick);
  }
  function play(){
    if(reduced){time=config.kind==='splash'?config.duration:0;render();complete();emit();return;}
    if(playing)return;
    if(time>=config.duration){time=0;finished=false;}
    playing=true;last=performance.now();frame=requestAnimationFrame(tick);emit();
  }
  function seek(value){time=Math.max(0,Math.min(config.duration,Number(value)||0));finished=false;last=performance.now();render();emit();}
