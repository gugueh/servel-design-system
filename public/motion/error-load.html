<script>
(() => {
  const config={"id": "error-load", "title": "Error al cargar", "kind": "illustration", "width": 393, "height": 300, "duration": 16, "movement": 16, "pause": 0, "figma": ""};
  const svg=document.querySelector('svg');
  const query=new URLSearchParams(location.search);
  let time=0, playing=false, loop=config.kind==='illustration', last=0, frame=0, reported=0;
  let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let finished=false;
  svg.pauseAnimations();
  const render=()=>svg.setCurrentTime(Math.max(0,Math.min(time,config.duration-0.00001)));
  const emit=()=>parent.postMessage({source:'servel-motion',time,playing,loop,duration:config.duration},'*');
  const complete=()=>{
    if(finished)return;
    finished=true;
    if(window.ServelAndroid)window.ServelAndroid.completed();
    if(window.ServelFlutter)window.ServelFlutter.postMessage('completed');
    window.dispatchEvent(new Event('servel-motion-completed'));
  };
  function pause(){playing=false;cancelAnimationFrame(frame);emit();}
  function tick(now){
    if(!playing)return;
    time+=Math.max(0,(now-last)/1000);last=now;
    if(config.kind==='splash'&&time>=config.movement)complete();
    if(time>=config.duration){
      complete();
      if(loop){time%=config.duration;finished=false;}
      else{time=config.duration;playing=false;}
    }
    render();
    if(now-reported>80||!playing){emit();reported=now;}
    if(playing)frame=requestAnimationFrame(tick);
  }
  function play(){
    if(reduced){time=config.kind==='splash'?config.duration:0;render();complete();emit();return;}
    if(playing)return;
    if(time>=config.duration){time=0;finished=false;}
    playing=true;last=performance.now();frame=requestAnimationFrame(tick);emit();
  }
  function seek(value){time=Math.max(0,Math.min(config.duration,Number(value)||0));finished=false;last=performance.now();render();emit();}
  window.ServelMotion={play,pause,seek,restart(){pause();seek(0);play();},setLoop(value){loop=!!value;emit();},setReducedMotion(value){reduced=!!value;if(reduced){pause();time=config.kind==='splash'?config.duration:0;render();}emit();}};

    if(event.source!==parent||event.data?.source!=='servel-motion-control')return;
    const {command,value}=event.data;
    if(command==='play')play();else if(command==='pause')pause();else if(command==='restart')window.ServelMotion.restart();
    else if(command==='seek')seek(value);else if(command==='loop')window.ServelMotion.setLoop(value);
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>window.ServelMotion.setReducedMotion(e.matches));
  if(query.get('loop')==='0')loop=false;
  if(query.get('autoplay')==='0'){svg.setCurrentTime(config.kind==='splash'?1.8:0);emit();}
  else{render();play();}
